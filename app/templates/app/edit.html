<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
</head>
<body class="container mt-5">
    <h2 class="pb-3">ToDo Add-Task</h2>
    <form action="{% url 'update' d.id %}" method="post">
                    {% csrf_token %}
                    <span style="display: flex;">
                    <input type="text" class="form-control" placeholder="Add a Task" name="task" value="{{d.task}}">
                    <button type="submit" class="btn btn-primary" style="width: 200px;"><i class="bi bi-plus-square"></i> Edit</button>
                    </span>
    </form>
</body>
</html>
